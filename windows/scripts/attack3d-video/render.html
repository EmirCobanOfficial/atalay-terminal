<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}#host{position:absolute;inset:0}</style>
</head><body><div id="host"></div>
<script>
// Offline renderer for the attack's 3D show: loads the app's scene3d.js + assets.js, builds the scene once, then draws any t.
window.R = {
  async setup(webBase, opts) {
    const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => no(new Error(src)); document.head.appendChild(s); });
    await load(webBase + 'attack3d/assets.js');
    await load(webBase + 'attack3d/scene3d.js');
    const pack = window.__ATTACK3D_PACK, lib = window.AttackSceneV3;
    const bytes = (b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0));
    const url = (b, m) => URL.createObjectURL(new Blob([bytes(b)], { type: m }));
    const sprites = {};
    for (const [k, v] of Object.entries(pack.sprites)) sprites[k] = { url: url(v.b64, v.mime), json: v.json };
    const host = document.getElementById('host');
    const scene = (this.scene = lib.createAttackScene({ container: host, reduced: false, dpr: opts.dpr || 1, frostUrl: false }));
    await scene.cracksReady;
    await Promise.all([scene.setSprites(sprites), scene.loadShip(url(pack.ship, 'model/gltf-binary'), { length: 6.5, nose: '+z' })]);
    const T = {};
    for (const k in scene.T) T[k] = scene.T[k];
    return { T, iw: innerWidth, ih: innerHeight, dpr: devicePixelRatio, dom: this.dom() };
  },
  dom() {
    const out = [];
    const walk = (el, d) => {
      const cs = getComputedStyle(el);
      out.push({ d, tag: el.tagName, id: el.id, cls: String(el.className || ''), w: el.width, h: el.height, cw: el.clientWidth, ch: el.clientHeight,
        pos: cs.position, z: cs.zIndex, op: cs.opacity, blend: cs.mixBlendMode, filter: cs.filter, transform: cs.transform, inset: [cs.left, cs.top, cs.right, cs.bottom].join(' '), bg: cs.backgroundColor });
      for (const c of el.children) walk(c, d + 1);
    };
    walk(document.getElementById('host'), 0);
    return out;
  },
  draw(t) { this.scene.render(t); },
};
</script>
</body></html>

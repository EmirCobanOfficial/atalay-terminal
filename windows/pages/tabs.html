<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbiterm</title>
<link rel="stylesheet" href="tabs.css">
</head>
<body>
<!-- A terminal window's tabs (main.js's frames), the Mac's PaneTabBar: shown with two tabs or more. -->
<nav id="bar" hidden>
  <div id="chips" role="tablist" aria-label="Tabs"></div>
  <button id="more" type="button" title="All tabs" aria-label="All tabs" hidden>»</button>
</nav>
<!-- Over a split: the window's bar, the Mac's header (ChatWindow.swift: TitleRow over HUDRow), for the pane with the keys;
     each pane keeps a slim strip of its own (the Mac's PaneTitleBar). Its buttons act for that pane (main.js hudOf). -->
<header id="hud" hidden>
  <div id="hudTitle" class="row">
    <svg id="hex" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l5.5 3.2v6.4L8 14.4l-5.5-3.2V4.8z"/></svg>
    <b id="project"></b>
    <!-- In a linked worktree (the Mac's WorktreeChipView); a click shows its changes in Source Control. -->
    <button id="wt" type="button" hidden></button>
    <!-- The Claude account of this pane, with two or more accounts (the Mac's AccountChip); a click opens its menu. -->
    <button id="acct" type="button" hidden aria-haspopup="menu"></button>
    <span id="sep">·</span>
    <span id="title"></span>
    <span class="spacer"></span>
    <!-- The worktree's next step and ▾ for everything (the Mac's WorktreeShipButton). -->
    <span id="ship" hidden><button id="shipMain" type="button"></button><button id="shipMore" type="button" aria-haspopup="menu" title="More for this worktree"></button></span>
    <!-- The status and how long it's been so (the Mac's StatusPill); why it waits in its tooltip. -->
    <span id="pill"></span>
  </div>
  <div id="hudRow" class="row">
    <!-- A plain terminal: where it is. An AI: its context, model and effort, cost, counts, the tool call it's on. Else it starts. -->
    <span id="where" hidden></span>
    <span id="ctx" hidden><i>ctx</i><span class="bar"><span></span></span><span class="n"></span></span>
    <span id="model" hidden></span>
    <span id="cost" hidden></span>
    <span id="counts" hidden></span>
    <span id="action" hidden><b class="name"></b><span class="label"></span><i class="dur"></i></span>
    <span id="starting" hidden></span>
    <span class="spacer"></span>
    <span id="spark" hidden><svg viewBox="0 0 96 18" preserveAspectRatio="none" aria-hidden="true"></svg></span>
    <button id="copy" class="hb" type="button" data-act="copy" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5" width="8" height="9" rx="1"/><path d="M3 11.5V3a1 1 0 0 1 1-1h6.5"/></svg></button>
    <button id="env" class="hb word" type="button" data-act="env">env</button>
    <button id="star" class="hb" type="button" data-act="star" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg></button>
    <button id="pin" class="hb" type="button" data-act="pin"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5.8 1.8h4.4l-.7 4.4 2.7 2.5H3.8l2.7-2.5zM8 8.7v5.6"/></svg></button>
    <button id="end" class="hb" type="button" data-act="end" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8v6"/><path d="M4.4 4.3a5.2 5.2 0 1 0 7.2 0"/></svg></button>
  </div>
</header>
<!-- The gaps between split panes, where a divider is dragged; the terminals are views over the rest of the page. -->
<div id="gaps"></div>
<script src="tabs.js"></script>
</body>
</html>
